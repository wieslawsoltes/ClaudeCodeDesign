name: Recover interrupted source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/recover-source.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover available Brotli source records
        run: |
          mkdir -p recovery/files
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const chunks = fs.readdirSync('.bootstrap').filter(x => /^source\.\d+\.b64$/.test(x)).sort();
          const bytes = Buffer.from(chunks.map(x => fs.readFileSync('.bootstrap/' + x, 'utf8')).join(''), 'base64');
          const stream = zlib.createBrotliDecompress({finishFlush: zlib.constants.BROTLI_OPERATION_FLUSH});
          const output = [];
          stream.on('data', data => output.push(data));
          stream.on('end', () => fs.writeFileSync('recovery/partial-source.json', Buffer.concat(output)));
          stream.on('error', error => { fs.writeFileSync('recovery/partial-source.json', Buffer.concat(output)); console.log(error.message); });
          stream.end(bytes);
          NODE
          python3 <<'PY'
          import json, pathlib
          text = pathlib.Path('recovery/partial-source.json').read_bytes().decode('utf-8', errors='ignore')
          dec = json.JSONDecoder()
          pos = 1
          recovered = []
          while pos < len(text):
              try:
                  while text[pos] in ' \n\r\t,': pos += 1
                  key, pos = dec.raw_decode(text, pos)
                  while text[pos] in ' \n\r\t:': pos += 1
                  value, pos = dec.raw_decode(text, pos)
                  path = pathlib.PurePosixPath(key)
                  if path.is_absolute() or '..' in path.parts or not isinstance(value, str): raise ValueError('Unsafe record')
                  dest = pathlib.Path('recovery/files') / path
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_text(value, encoding='utf-8')
                  recovered.append(key)
              except (ValueError, IndexError) as err:
                  print('End of recoverable records:', err)
                  break
          pathlib.Path('recovery/report.json').write_text(json.dumps({'recovered': recovered, 'bytes': len(text.encode()), 'complete': text.rstrip().endswith('}')}, indent=2))
          print('\n'.join(recovered))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source
          path: recovery/
          include-hidden-files: true
          retention-days: 7
